<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Recording - Capture Studio</title>
  <link rel="stylesheet" href="desktop-recorder.css">
</head>
<body>
  <main class="recorder-card">
    <div class="recorder-icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>
    <h1>Record screen or window</h1>
    <p id="statusText">Choose a source once. This window will minimize when recording starts.</p>
    <button id="btnStart" type="button">Choose Source &amp; Start</button>
    <button id="btnCancel" class="secondary" type="button">Cancel</button>
  </main>

  <script src="../utils/db.js"></script>
  <script src="desktop-recorder.js"></script>
</body>
</html>
