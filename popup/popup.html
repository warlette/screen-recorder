<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture Studio: Recorder & Screenshots</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="4" />
            <circle cx="12" cy="12" r="4" fill="#EF4444" stroke="none" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>Capture Studio</h1>
          <span class="badge">Pro</span>
        </div>
      </div>
      <button id="btnOpenGallery" class="icon-btn" title="Open Media Gallery">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </button>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tab-record">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2"/>
        </svg>
        Record
      </button>
      <button class="tab-btn" data-tab="tab-screenshot">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Screenshot
      </button>
      <button class="tab-btn" data-tab="tab-recent">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        History
      </button>
    </nav>

    <!-- Main Content Panels -->
    <main class="tab-content">
      <!-- Screen Recorder Panel -->
      <section id="tab-record" class="panel active">
        <!-- Live Recording Status Bar -->
        <div id="recordingStatus" class="status-card hidden">
          <div class="pulse-indicator"></div>
          <div class="status-info">
            <span class="status-title">Recording Active</span>
            <span id="recordingTimer" class="status-timer">00:00</span>
          </div>
        </div>

        <div id="recordingOptions" class="options-group">
          <!-- Target Selection -->
          <div class="option-title">Record Source</div>
          <div class="segment-control">
            <button type="button" class="segment-btn active" data-mode="desktop">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
              Screen / Window
            </button>
            <button type="button" class="segment-btn" data-mode="tab">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12z"/>
                <line x1="4" y1="9" x2="20" y2="9"/>
              </svg>
              Current Tab
            </button>
          </div>

          <div class="option-title" style="margin-top: 14px;">Audio Inputs</div>
          
          <label class="toggle-control">
            <div class="toggle-info">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
              <span>Source Audio (when available)</span>
            </div>
            <input type="checkbox" id="chkAudio" checked>
            <span class="switch"></span>
          </label>

          <label class="toggle-control">
            <div class="toggle-info">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
              <span>Microphone Audio</span>
            </div>
            <input type="checkbox" id="chkMic">
            <span class="switch"></span>
          </label>
        </div>

        <div class="action-section">
          <button id="btnStartRecord" class="btn btn-primary btn-record">
            <span class="record-dot"></span>
            Start Recording
          </button>
          <button id="btnStopRecord" class="btn btn-danger hidden">
            <square width="14" height="14" fill="currentColor"></square>
            Stop & Save
          </button>
        </div>
      </section>

      <!-- Screenshot Panel -->
      <section id="tab-screenshot" class="panel">
        <div class="feature-card">
          <div class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
          </div>
          <h3>Full Page Capture</h3>
          <p>Scrolls the active page and stitches the visible-width sections into a PNG. Very tall pages may be scaled.</p>
          <button id="btnCaptureFullPage" class="btn btn-secondary">
            Capture Full Page
          </button>
        </div>

        <div class="divider"><span>OR</span></div>

        <div class="feature-card compact">
          <div class="feature-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            </svg>
            <span>Visible Viewport Only</span>
          </div>
          <button id="btnCaptureVisible" class="btn btn-ghost">
            Capture Visible Area
          </button>
        </div>
      </section>

      <!-- History Panel -->
      <section id="tab-recent" class="panel">
        <div id="recentList" class="recent-list">
          <div class="empty-state">
            <p>No captures recorded yet.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Error / Info Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="../utils/db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
